<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1c24">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>山河武俠・鏢船夜盜</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="boot" class="boot" hidden>
    <p class="boot-kicker">山河武俠</p>
    <h1>霧夜正在靠岸</h1>
    <p id="boot-status" class="boot-status">正在載入戰鬥引擎…</p>
    <div class="boot-bar"><span id="boot-bar"></span></div>
  </div>

  <main id="app" class="app" hidden>
    <header class="masthead">
      <p class="series">山河武俠</p>
      <h1 id="title">青禾渡・鏢船夜盜</h1>
      <p id="meta" class="meta">第 15 章　青禾渡渡口</p>
    </header>

    <p id="flavor" class="flavor"></p>

    <section class="field" aria-label="戰場">
      <div class="bank bank-escort">
        <article id="player-card" class="unit unit-escort"></article>
      </div>
      <div class="river" aria-hidden="true">
        <span class="skiff"></span>
        <span class="skiff delay"></span>
      </div>
      <div class="bank bank-raiders">
        <article id="enemy-a" class="unit unit-thief"></article>
        <article id="enemy-b" class="unit unit-thief"></article>
      </div>
    </section>

    <ol id="log" class="log" aria-live="polite"></ol>

    <section class="controls">
      <div id="actions" class="actions"></div>
      <div class="row">
        <button type="button" id="btn-submit" class="btn primary" disabled>出手</button>
        <button type="button" id="btn-auto" class="btn">自動演示</button>
        <button type="button" id="btn-reset" class="btn ghost">再來一次</button>
      </div>
    </section>

    <p id="ending" class="ending" hidden></p>
    <p id="credits" class="credits"></p>
  </main>

  <p id="fatal" class="fatal" hidden></p>
  <script src="js/app.js"></script>
</body>
</html>
