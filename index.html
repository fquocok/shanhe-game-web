<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101614" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#101614">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="山河武俠">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>山河武俠</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="boot" class="boot" hidden>
    <p class="boot-kicker">山河武俠</p>
    <h1 id="boot-title">霧夜正在靠岸</h1>
    <p id="boot-status" class="boot-status">正在載入…</p>
    <div class="boot-bar"><span id="boot-bar"></span></div>
  </div>

  <section id="map-screen" class="map-screen" hidden>
    <header class="map-head">
      <p class="series">山河武俠</p>
      <h1 id="map-title">青禾渡一帶</h1>
      <p id="map-sub" class="map-sub">測試用地圖，第 3 期會換成正式地圖。</p>
    </header>
    <div id="map-sheet" class="map-sheet" aria-label="青禾渡關卡地圖"></div>
    <p id="map-toast" class="map-toast" hidden></p>
    <footer class="map-foot">
      <button type="button" id="btn-reset-save" class="btn text">重設進度</button>
      <p class="build-label" hidden></p>
    </footer>
  </section>

  <section id="tutorial-screen" class="tutorial-screen" hidden>
    <header class="masthead">
      <div class="mast-left">
        <p class="series">山河武俠</p>
        <h1 id="tutorial-title">學那一腳</h1>
      </div>
      <p id="tutorial-meta" class="meta">青禾渡・回家路上</p>
    </header>
    <div id="tutorial-figure" class="tutorial-figure" aria-hidden="true">
      <div id="tutorial-rig" class="rig-mount"></div>
    </div>
    <div id="tutorial-beats" class="tutorial-page"></div>
    <p id="tutorial-end" class="ending" hidden></p>
    <p id="tutorial-credits" class="credits"></p>
    <section class="controls">
      <div class="row">
        <button type="button" id="tutorial-action" class="btn seal">試那一腳</button>
        <div class="text-actions">
          <button type="button" id="tutorial-back" class="btn text">回地圖</button>
        </div>
      </div>
    </section>
  </section>

  <section id="event-screen" class="event-screen tutorial-screen" hidden>
    <header class="masthead">
      <div class="mast-left">
        <p class="series">山河武俠</p>
        <h1 id="event-title">事件</h1>
      </div>
      <p id="event-meta" class="meta"></p>
    </header>
    <div id="event-meter" class="event-meter" hidden>
      <span class="event-meter-label">對峙</span>
      <span id="event-meter-bar" class="event-meter-bar"></span>
    </div>
    <div id="event-beats" class="tutorial-page"></div>
    <p id="event-prompt" class="event-prompt" hidden></p>
    <div id="event-timer" class="event-timer" hidden><span id="event-timer-bar"></span></div>
    <p id="event-end" class="ending" hidden></p>
    <p id="event-credits" class="credits"></p>
    <section class="controls">
      <div id="event-choices" class="event-choices"></div>
      <div class="row">
        <button type="button" id="event-action" class="btn seal">繼續</button>
        <div class="text-actions">
          <button type="button" id="event-back" class="btn text">回地圖</button>
        </div>
      </div>
    </section>
  </section>

  <main id="app" class="app" hidden>
    <div class="scene" data-slot="backgrounds/qinghedu-barge-night-tall.webp">
      <img class="scene-art" data-src="assets/backgrounds/qinghedu-barge-night-tall.webp" alt="">
    </div>

    <header class="masthead">
      <div class="mast-left">
        <p class="series">山河武俠</p>
        <h1 id="title">青禾渡・鏢船夜盜</h1>
      </div>
      <p id="meta" class="meta">第十五章・其一</p>
    </header>

    <p id="flavor" class="flavor"></p>

    <section class="field" aria-label="戰場">
      <article id="ahe-watch" class="ahe" title="阿禾躲在草棚後頭偷看">
        <img class="art" data-src="assets/portraits/ahe-watch.webp" alt="阿禾" hidden>
        <p class="ahe-caption">草棚後偷看・阿禾</p>
      </article>

      <div class="bank bank-stern bank-raiders">
        <article id="enemy-a" class="unit unit-thief unit-thief-a" data-slot="portraits/thief-a-battle.webp"></article>
        <article id="enemy-b" class="unit unit-thief unit-thief-b" data-slot="portraits/thief-b-battle.webp"></article>
      </div>

      <div class="bank bank-deck bank-escort">
        <article id="player-card" class="unit unit-escort" data-slot="portraits/escort-battle.webp"></article>
      </div>

      <p id="skill-flash" class="skill-flash" hidden></p>
    </section>

    <ol id="log" class="log" aria-live="polite"></ol>

    <section class="controls">
      <div id="actions" class="actions"></div>
      <div class="row">
        <button type="button" id="btn-submit" class="btn seal" disabled>出手</button>
        <div class="text-actions">
          <button type="button" id="btn-auto" class="btn text">手動</button>
          <button type="button" id="btn-reset" class="btn text">再來一次</button>
          <button type="button" id="btn-back-map" class="btn text">回地圖</button>
          <button type="button" id="btn-rig" class="btn text" aria-pressed="false" title="以墨線骨架觀看招式動作">墨線</button>
        </div>
      </div>
    </section>

    <p id="ending" class="ending" hidden></p>
    <p id="credits" class="credits"></p>
    <p class="build-label" hidden></p>
  </main>

  <div id="confirm" class="confirm" hidden>
    <div class="confirm-sheet" role="dialog" aria-labelledby="confirm-text">
      <p id="confirm-text">要重設本地進度嗎？已過關紀錄會清掉。</p>
      <div class="row">
        <button type="button" id="confirm-ok" class="btn seal">確定</button>
        <button type="button" id="confirm-no" class="btn text">取消</button>
      </div>
    </div>
  </div>

  <div id="pwa-update" class="pwa-update" hidden>
    <span>有新版本</span>
    <button type="button" id="pwa-reload">重新載入</button>
  </div>
  <p id="fatal" class="fatal" hidden></p>
  <script src="js/rig.js"></script>
  <script src="js/motion.js"></script>
  <script src="js/save.js"></script>
  <script src="js/map.js"></script>
  <script src="js/tutorial.js"></script>
  <script src="js/event.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
